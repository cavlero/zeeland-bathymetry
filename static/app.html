<body>
<div id="root"></div>
<noscript>
  <main style="max-width:640px;margin:3rem auto;padding:0 1.5rem;font-family:system-ui,sans-serif;line-height:1.6;">
    <h1>Bathymetry Explorer - 3D Terrain for Zeeland Dive Sites</h1>
    <p>
      Explore the terrain around ~125 Zeeland dive sites, both on land and underwater.
      Pick a spot on the map and get a 2D elevation map plus an interactive
      3D model, built by merging elevation data from Rijkswaterstaat.
    </p>
    <p>This app requires JavaScript to run. Please enable it to use the interactive map and 3D viewer.</p>
  </main>
</noscript>
